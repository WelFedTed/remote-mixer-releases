<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Remote Mixer banner</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { display: grid; place-items: center; font: 600 13px system-ui, "Segoe UI", sans-serif; }
  /* House banner: shown until an ad network fills the slot. It fills the frame;
     on phones the frame is the full screen width (the app rounds the PC banner). */
  .house { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
           gap: 10px; padding: 0 12px; background: #17191e; color: #b4b8c0; text-decoration: none; }
  .house b { color: #7c9cff; }
</style>
</head>
<body>
  <!--
    Banner page for the Remote Mixer app. The app loads this page in a sandboxed iframe:
      ?w=320&h=50   (phone)   or   ?w=728&h=90   (PC)
    The frame cannot read the mixer page, and the app sends no Referer.

    AD NETWORK: paste the code of your ad unit below, in place of the house banner.
    Most networks (for example Google AdSense) need a domain that you own: point it at this
    GitHub Pages site (repo Settings > Pages > Custom domain) and approve that domain in the network.
  -->
  <a class="house" href="https://github.com/WelFedTed/remote-mixer-releases" target="_blank" rel="noopener">
    Remote Mixer <b>Your ad here</b>
  </a>
</body>
</html>
